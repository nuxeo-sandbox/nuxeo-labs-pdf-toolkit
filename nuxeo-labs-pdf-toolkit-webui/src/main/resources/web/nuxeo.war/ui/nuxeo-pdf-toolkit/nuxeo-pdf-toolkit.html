<!--
`nuxeo-pdf-toolkit`
Displays a dialog allowing to extract, remove or reorder pages of a PDF document.
-->
<link rel="import" href="nuxeo-pdf-toolkit-thumbnails.html">
<link rel="import" href="nuxeo-pdf-toolkit-preview.html">
<link rel="import" href="nuxeo-pdf-toolkit-actions.html">
<dom-module id="nuxeo-pdf-toolkit">
  <template>
    <style include="nuxeo-styles nuxeo-action-button-styles">
      :host {
        display: inline-block;
      }

      #dialog {
        width: 80%;
        height: 80vh;
        display: flex;
        flex-direction: column;
      }

      .dialog-header {
        padding: 16px 24px;
        border-bottom: 1px solid #e0e0e0;
        font-size: 20px;
        font-weight: 500;
      }

      .dialog-header .page-count {
        margin-left: 12px;
        font-size: 14px;
        font-weight: 400;
        color: var(--nuxeo-text-default, #666);
      }

      .dialog-content {
        flex: 1;
        overflow-y: auto;
        padding: 16px 24px;
      }

      .dialog-actions {
        padding: 16px 24px;
        border-top: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 5px;
        margin-bottom: 5px;
      }

      #confirmDialog {
        width: 420px;
        max-width: 90%;
      }

      .confirm-content {
        padding: 24px;
      }

      .confirm-actions {
        padding: 16px 24px;
        border-top: 1px solid #e0e0e0;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      paper-button.danger {
        background-color: #d32f2f;
        color: white;
      }

      /* "running operation"" overlay styles */
      .runningOperation-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.9);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      .runningOperation-message {
        margin-top: 16px;
        font-size: 14px;
        color: var(--nuxeo-text-default, #666);
        text-align: center;
      }

      paper-spinner {
        --paper-spinner-layer-1-color: var(--nuxeo-primary-color, #0066cc);
        --paper-spinner-layer-2-color: var(--nuxeo-primary-color, #0066cc);
        --paper-spinner-layer-3-color: var(--nuxeo-primary-color, #0066cc);
        --paper-spinner-layer-4-color: var(--nuxeo-primary-color, #0066cc);
      }
    </style>

    <nuxeo-connection id="nx"></nuxeo-connection>

    <nuxeo-operation id="extractOp" op="PDFLabs.ExtractPagesByRange"></nuxeo-operation>
    <nuxeo-operation id="removePagesOp" op="PDFLabs.RemovePages"></nuxeo-operation>
    <nuxeo-operation id="reorderOp" op="PDFLabs.ReorderPages"></nuxeo-operation>

    <nuxeo-operation id="prepareThumbnailsOp" op="PDFLabs.PrepareThumbnails"></nuxeo-operation>

    <div class="action" on-tap="_openDialog">
      <paper-icon-button id="bt" icon="[[icon]]"></paper-icon-button>
      <span class="label" hidden$="[[!showLabel]]">[[i18n(label)]]</span>
    </div>
    <paper-tooltip for="bt">[[i18n(label)]]</paper-tooltip>

    <paper-dialog id="dialog" modal on-iron-overlay-opened="_onDialogOverlayOpened">
      <div class="dialog-header">
        [[document.title]]
        <span class="page-count" hidden$="[[!_pageCount]]">[[i18n('pdftoolkit.label.pageCount', _pageCount)]]</span>
      </div>

      <div class="dialog-content" id="dialogContent">
        <!-- Running operation indicator -->
        <template is="dom-if" if="[[_runningOperation]]">
          <div class="runningOperation-overlay">
            <paper-spinner active></paper-spinner>
            <div class="runningOperation-message">[[_getRunningOperationMessage()]]</div>
          </div>
        </template>

        <nuxeo-pdf-toolkit-thumbnails
          id="thumbnails"
          sources="[[thumbnailSources]]"
          loading="[[loading]]"
          debug="[[debug]]"
          has-selection="{{_hasSelection}}"
          has-reordered="{{_hasReordered}}"
          on-chunk-needed="_onChunkNeeded"
          on-page-preview="_onPagePreview">
        </nuxeo-pdf-toolkit-thumbnails>
      </div>

      <div class="dialog-actions">
        <nuxeo-pdf-toolkit-actions
          document="[[document]]"
          has-selection="[[_hasSelection]]"
          has-reordered="[[_hasReordered]]"
          on-action-complete="_onActionComplete">
        </nuxeo-pdf-toolkit-actions>
        <paper-button on-tap="_onCloseTap">
          <iron-icon icon="icons:close"></iron-icon>
          [[i18n('pdftoolkit.label.close')]]
        </paper-button>
      </div>
    </paper-dialog>

    <!-- Replacing the main file is destructive: confirm before doing it -->
    <paper-dialog id="confirmDialog" modal>
      <div class="confirm-content">[[i18n('pdftoolkit.confirm.removePages')]]</div>
      <div class="confirm-actions">
        <paper-button on-tap="_cancelRemove">
          <iron-icon icon="icons:close"></iron-icon>
          [[i18n('pdftoolkit.label.cancel')]]
        </paper-button>
        <paper-button class="danger" on-tap="_confirmRemove">
          <iron-icon icon="icons:check"></iron-icon>
          [[i18n('pdftoolkit.label.ok')]]
        </paper-button>
      </div>
    </paper-dialog>

    <nuxeo-pdf-toolkit-preview id="preview" on-iron-overlay-closed="_onPreviewDialogClosed"></nuxeo-pdf-toolkit-preview>

  </template>

  <script>
    Polymer({
      is: 'nuxeo-pdf-toolkit',
      behaviors: [Nuxeo.LayoutBehavior],

      properties: {
        document: {
          type: Object,
          observer: '_documentChanged'
        },

        icon: {
          type: String,
          value: 'icons:build'
        },

        label: {
          type: String,
          value: 'PDF Toolkit'
        },

        showLabel: {
          type: Boolean,
          value: false
        },

        thumbnailSources: {
          type: Array,
          value: function() { return []; }
        },

        /*
         * Rendering parameters asked of the server for the grid thumbnails. The CSS displays them at
         * 120px, so 256px still covers a high density screen, and 72 dpi is enough to fill 256px on a
         * portrait page. The defaults of the operations stay at 512 / 150 dpi for anyone calling them
         * from Studio or a script: only this dialog asks for something lighter. Rendering cost grows
         * with the square of the dpi, so this is where the time goes.
         */
        thumbnailWidth: {
          type: Number,
          value: 256
        },

        thumbnailHeight: {
          type: Number,
          value: 256
        },

        thumbnailDpi: {
          type: Number,
          value: 72
        },

        /*
         * Trace the chunk loading in the browser console: visible pages, chunks requested, chunks
         * applied and how many tiles each filled. Off by default. Two ways to turn it on, the second
         * one needing no rebuild at all, which matters because this is the only diagnostic there is:
         *   <nuxeo-pdf-toolkit document="[[document]]" debug></nuxeo-pdf-toolkit>
         *   window.NUXEO_PDF_TOOLKIT_DEBUG = true   (in the console, before opening the dialog)
         */
        debug: {
          type: Boolean,
          value: function() {
            return typeof window !== 'undefined' && !!window.NUXEO_PDF_TOOLKIT_DEBUG;
          }
        },

        loading: {
          type: Boolean,
          value: false
        },

        _hasSelection: {
          type: Boolean,
          value: false
        },

        _hasReordered: {
          type: Boolean,
          value: false
        },

        _runningOperation: {
          type: Boolean,
          value: false
        },

        _operationStartTime: {
          type: Number,
          value: 0
        },

        _hideOverlayTimer: {
          type: Number,
          value: 0
        },

        // Holds the parameters of a remove action waiting for user confirmation
        _pendingRemove: {
          type: Object,
          value: null
        },

        // ==============================================
        // Chunked thumbnails loading
        // ==============================================
        // Total number of pages of the PDF, known as soon as the first chunk came back
        _pageCount: {
          type: Number,
          value: 0
        },

        // Chunk size the server applied, it owns that setting
        _chunkSize: {
          type: Number,
          value: 0
        },

        // Chunk start -> true, for the chunks already rendered
        _preparedChunks: {
          type: Object,
          value: function() { return {}; }
        },

        // Chunk start -> true, for the chunks queued or in flight
        _pendingChunks: {
          type: Object,
          value: function() { return {}; }
        },

        _chunkQueue: {
          type: Array,
          value: function() { return []; }
        },

        _chunkLoading: {
          type: Boolean,
          value: false
        },

        // Scroll position of the grid before a preview overlay is opened on top of it
        _scrollTopBeforePreview: {
          type: Number,
          value: 0
        },

        // Last known scroll position, kept up to date while the user scrolls
        _lastScrollTop: {
          type: Number,
          value: 0
        },

        // Bound reference of the listener kept on the scrolling container
        _dialogScrollHandler: {
          type: Object,
          value: null
        },

        // The node that listener is attached to, to detect a replaced container
        _dialogScrollTarget: {
          type: Object,
          value: null
        },

        // True between the closing of a preview and the scroll wipe that follows it
        _restorePending: {
          type: Boolean,
          value: false
        }

      },

      // ==============================================
      // Lifecycle & dialog logic
      // ==============================================
      detached: function() {
        // Do not let a pending timer fire on a detached element
        if (this._hideOverlayTimer) {
          clearTimeout(this._hideOverlayTimer);
          this._hideOverlayTimer = 0;
        }
        this._unbindDialogScroll();
      },

      _documentChanged: function() {
        this.set('thumbnailSources', []);
        this._resetChunkState();
        if (this.$.thumbnails) {
          this.$.thumbnails.reset();
        }
      },

      // Message of the overlay shown while an operation runs. The template has always called it, but
      // it was never defined, so the overlay showed an empty line.
      _getRunningOperationMessage: function() {
        return this.i18n('pdftoolkit.label.processing');
      },

      _resetChunkState: function() {
        this.set('_pageCount', 0);
        this.set('_chunkSize', 0);
        this._preparedChunks = {};
        this._pendingChunks = {};
        this._chunkQueue = [];
        this._chunkLoading = false;
        this._chunkErrorNotified = false;
      },

      _openDialog: function() {
        if (!this.document) {
          return;
        }

        /*
         * Re-read the debug flag here. This element is created together with the document page, long
         * before anyone can set the flag from the console, so a `value:` read once at creation time
         * is always too early. localStorage is honoured too, as it survives a page reload.
         */
        if (!this.debug && typeof window !== 'undefined') {
          var stored = window.localStorage && window.localStorage.getItem('NUXEO_PDF_TOOLKIT_DEBUG');
          if (window.NUXEO_PDF_TOOLKIT_DEBUG || stored) {
            this.set('debug', true);
          }
        }

        this._lastScrollTop = 0;
        this._scrollTopBeforePreview = 0;
        this._restorePending = false;
        this.$.dialog.open();
        this._bindDialogScroll();
        this._loadThumbnails();
      },

      /**
       * Keep track of where the user is, continuously.
       *
       * Idempotent and self-healing, like the grid's own binding: the content container is replaced
       * when the dialog is re-opened, and a listener left behind on the old node silently stops
       * updating _lastScrollTop — which then stays frozen at its last value for good.
       */
      _bindDialogScroll: function() {
        var container = this.$.dialogContent;
        if (!container) {
          return;
        }
        if (this._dialogScrollTarget === container && container.isConnected) {
          return;
        }

        this._unbindDialogScroll();

        this._dialogScrollTarget = container;
        this._dialogScrollHandler = function() {
          if (container.scrollTop > 0) {
            this._lastScrollTop = container.scrollTop;
          }
        }.bind(this);
        container.addEventListener('scroll', this._dialogScrollHandler, { passive: true });
      },

      _unbindDialogScroll: function() {
        if (this._dialogScrollTarget && this._dialogScrollHandler) {
          this._dialogScrollTarget.removeEventListener('scroll', this._dialogScrollHandler);
        }
        this._dialogScrollTarget = null;
        this._dialogScrollHandler = null;
      },

      _onCloseTap: function() {
        // Plain close: nothing was modified, no need to make the UI reload the document
        this._closeDialog(false);
      },

      _closeDialog: function(documentWasModified) {
        this.$.dialog.close();
        if (documentWasModified) {
          this.fire('document-updated');
        }
      },

      // ==============================================
      // UI events from children
      // ==============================================
      _onPagePreview: function(e) {
        /*
         * The live value wins. _lastScrollTop is only a fallback for the case where the position was
         * already wiped before we got here: trusting it first froze the saved position at whatever
         * the first restoration had written, and every later preview came back to that same page.
         */
        var container = this.$.dialogContent;
        var live = container ? container.scrollTop : 0;
        this._scrollTopBeforePreview = live > 0 ? live : this._lastScrollTop;

        if (this.debug) {
          console.log('[pdf-toolkit] preview opening for page ' + e.detail.pageNum
            + ', live=' + live + ', lastKnown=' + this._lastScrollTop
            + ' -> saved=' + this._scrollTopBeforePreview);
        }

        this.$.preview.loadPreviewPage(this.document, e.detail.pageNum);
      },

      /**
       * Closing an overlay stacked on top of this dialog makes the platform RE-OPEN this one.
       *
       * Measured on a 1000+ pages PDF: at that moment the content container goes through
       * clientHeight = 0 and scrollHeight = 0, which wipes scrollTop with no assignment at all —
       * there is nothing to intercept, only something to put back. This is the only place where the
       * restoration may happen, and it must wait for the height to come back.
       */
      _onDialogOverlayOpened: function() {
        var container = this.$.dialogContent;
        var current = container ? container.scrollTop : -1;

        // The container may have been replaced by the re-open: make sure we still track its scroll
        this._bindDialogScroll();

        // Logged unconditionally: a branch that stays silent when it does nothing is exactly what
        // hid the previous defect.
        if (this.debug) {
          console.log('[pdf-toolkit] dialog overlay opened, scrollTop=' + current
            + ', pending=' + !!this._restorePending
            + ', saved=' + this._scrollTopBeforePreview);
        }

        if (!this._restorePending || !(this._scrollTopBeforePreview > 0)) {
          return;
        }

        this._restoreScrollTop(this._scrollTopBeforePreview, 0);
      },

      /**
       * Put the scroll back, retrying until it sticks.
       *
       * Assigning scrollTop is a no-op while the container has no height yet, and the height only
       * comes back a few frames later, so a single assignment silently does nothing.
       */
      _restoreScrollTop: function(target, attempt) {
        var MAX_ATTEMPTS = 12;
        var container = this.$.dialogContent;

        if (!container || !target || !this._restorePending) {
          return;
        }

        if (attempt >= MAX_ATTEMPTS) {
          // Running out of attempts with the position intact simply means nothing was ever wiped
          var kept = Math.abs(container.scrollTop - target) < 2;
          if (this.debug) {
            if (kept) {
              console.log('[pdf-toolkit] scroll was never wiped, position kept at ' + container.scrollTop);
            } else {
              console.warn('[pdf-toolkit] gave up restoring scrollTop to ' + target
                + ' (still at ' + container.scrollTop + ') after ' + MAX_ATTEMPTS + ' attempts');
            }
          }
          this._restorePending = false;
          return;
        }

        /*
         * Nothing was lost yet. Do NOT treat this as a success: the wipe may still be coming, and
         * consuming the saved position here is precisely what neutralised the previous fix.
         */
        if (Math.abs(container.scrollTop - target) < 2) {
          this.async(function() {
            this._restoreScrollTop(target, attempt + 1);
          }.bind(this), 50);
          return;
        }

        // Assigning is pointless while the container has no height
        if (container.clientHeight > 0 && container.scrollHeight > container.clientHeight) {
          container.scrollTop = target;
          if (Math.abs(container.scrollTop - target) < 2) {
            if (this.debug) {
              console.log('[pdf-toolkit] scrollTop restored to ' + container.scrollTop
                + ' after ' + (attempt + 1) + ' attempt(s)');
            }
            this._restorePending = false;
            this._scrollTopBeforePreview = 0;
            this._lastScrollTop = container.scrollTop;
            if (this.$.thumbnails) {
              this.$.thumbnails.refreshScrollBinding();
            }
            return;
          }
        }

        this.async(function() {
          this._restoreScrollTop(target, attempt + 1);
        }.bind(this), 50);
      },

      /**
       * The preview dialog closed.
       *
       * The scroll is still INTACT at this point — measured. Touching it here is not just useless,
       * it is harmful: an early "restore" finds the value already correct, declares success and
       * consumes the saved position, so the real wipe a moment later has nothing left to put back.
       * Only arm the restoration and let _onDialogOverlayOpened do the work.
       */
      _onPreviewDialogClosed: function() {
        this._restorePending = true;

        if (this.debug) {
          var c = this.$.dialogContent;
          console.log('[pdf-toolkit] preview closed, scrollTop=' + (c ? c.scrollTop : 'n/a')
            + ', saved=' + this._scrollTopBeforePreview + ' — restoration armed');
        }

        // Never stay armed: an unrelated overlay opening later must not move the grid
        this.async(function() {
          if (this._restorePending) {
            this._restorePending = false;
            if (this.debug) {
              console.log('[pdf-toolkit] restoration window closed, nothing was wiped');
            }
          }
        }.bind(this), 3000);

        if (this.$.thumbnails) {
          this.$.thumbnails.refreshScrollBinding();
        }
      },

      _onActionComplete: function(e) {
        /* Event fired from nuxeo-pdf-toolkit-actions when user confirms destination
           The JSON sent is:
            {
              action: extract|remove|reorder,
              destination: download|derivative|attachments|newFile,
          // plus other params depending on destination:
          // for 'newFile': createVersion (boolean), versionType (string)
          // for derivative: resetLifeCycle (boolean), derivativeTitle (string)
          // . . .
            }
        */
        var destinationObj = this._buildDestinationObject(e.detail);

        switch (e.detail.action) {
          case 'extract':
            this._extractPages(destinationObj);
            break;

          case 'remove':
            this._removePages(destinationObj);
            break;

          case 'reorder':
            this._saveReorder(destinationObj);
            break;

          default:
            console.error('Unknown action:', e.detail.action);
            this.fire('notify', { message: this.i18n('pdftoolkit.error.actionFailed') });
        }
      },

      // ==============================================
      // PDF operations
      // ==============================================
      _extractPages: function(destinationObj) {
        var pageRange = this.$.thumbnails.getSelectedPageRanges();
        if (!pageRange) {
          this.fire('notify', { message: this.i18n('pdftoolkit.error.noPagesSelected') });
          return;
        }

        this._startRunningOperation();

        this.$.extractOp.input = this.document;
        this.$.extractOp.params = {
          pageRange: pageRange,
          destinationJsonStr: JSON.stringify(destinationObj)
        };

        this.$.extractOp.execute()
          .then(function(response) {
            this._handleResult(response, destinationObj.destination);
          }.bind(this))
          .catch(function(error) {
            this._handleOperationError(error);
          }.bind(this));
      },

      _removePages: function(destinationObj) {
        var pageRange = this.$.thumbnails.getSelectedPageRanges();
        if (!pageRange) {
          this.fire('notify', { message: this.i18n('pdftoolkit.error.noPagesSelected') });
          return;
        }

        if (destinationObj.destination === 'newFile') {
          // Destructive: replacing the main file. Ask for confirmation first.
          this._pendingRemove = { pageRange: pageRange, destinationObj: destinationObj };
          this.$.confirmDialog.open();
          return;
        }

        this._doRemovePages(pageRange, destinationObj);
      },

      _cancelRemove: function() {
        this._pendingRemove = null;
        this.$.confirmDialog.close();
      },

      _confirmRemove: function() {
        var pending = this._pendingRemove;
        this._pendingRemove = null;
        this.$.confirmDialog.close();
        if (pending) {
          this._doRemovePages(pending.pageRange, pending.destinationObj);
        }
      },

      _doRemovePages: function(pageRange, destinationObj) {
        this._startRunningOperation();

        this.$.removePagesOp.input = this.document;
        this.$.removePagesOp.params = {
          pageRange: pageRange,
          destinationJsonStr: JSON.stringify(destinationObj)
        };

        this.$.removePagesOp.execute()
          .then(function(response) {
            this._handleResult(response, destinationObj.destination);
          }.bind(this))
          .catch(function(error) {
            this._handleOperationError(error);
          }.bind(this));
      },

      _saveReorder: function(destinationObj) {
        var newOrder = this.$.thumbnails.getNewPageOrder();
        if (!newOrder || !newOrder.length) {
          this.fire('notify', { message: this.i18n('pdftoolkit.error.noPagesSelected') });
          return;
        }

        this._startRunningOperation();

        this.$.reorderOp.input = this.document;
        this.$.reorderOp.params = {
          pageOrderJsonStr: JSON.stringify(newOrder),
          destinationJsonStr: JSON.stringify(destinationObj)
        };

        this.$.reorderOp.execute()
          .then(function(response) {
            this._handleResult(response, destinationObj.destination);
          }.bind(this))
          .catch(function(error) {
            this._handleOperationError(error);
          }.bind(this));
      },

      // ==============================================
      // "Running operation" overlay
      // ==============================================
      _startRunningOperation: function() {
        // Cancel any pending hide
        if (this._hideOverlayTimer) {
          clearTimeout(this._hideOverlayTimer);
          this._hideOverlayTimer = 0;
        }
        this._operationStartTime = Date.now();
        this.set('_runningOperation', true);
      },

      _finishRunningOperation: function(callback) {
        var self = this;

        // If nothing is running, just call the callback immediately
        if (!this._runningOperation) {
          if (callback) {
            callback.call(this);
          }
          return;
        }

        var MIN_DURATION = 2000; // 2 seconds
        var now = Date.now();
        var start = this._operationStartTime || now;
        var elapsed = now - start;
        var remaining = MIN_DURATION - elapsed;

        var done = function() {
          self.set('_runningOperation', false);
          self._operationStartTime = 0;
          self._hideOverlayTimer = 0;
          if (callback) {
            callback.call(self);
          }
        };

        if (remaining > 0) {
          this._hideOverlayTimer = setTimeout(done, remaining);
        } else {
          done();
        }
      },

      _handleOperationError: function(error) {
        console.error(error);
        this.fire('notify', { message: this.i18n('pdftoolkit.error.actionFailed') });
        // Hide overlay, but keep the dialog open so the user can try again
        this._finishRunningOperation();
      },

      _handleResult: function(operationResponse, destination) {
        if (destination === 'download') {
          // Errors here happen outside the operation promise chain: catch them explicitly.
          this._downloadBlob(operationResponse)
              .catch(function(error) {
                this._handleOperationError(error);
              }.bind(this));
        }

        /*
         * We are done with the whole dialog. Ensure overlay stays at least 2 seconds, then close.
         * A download leaves the document untouched, anything else modified it.
         */
        this._finishRunningOperation(function() {
          this._closeDialog(destination !== 'download');
        }.bind(this));
      },

      // ==============================================
      // Helpers
      // ==============================================
      /**
       * Open the dialog on the first chunk of pages.
       *
       * Only that chunk is rendered server side, but the operation returns the URL of every page, so
       * the grid is laid out at its final size immediately. The remaining chunks are asked for as the
       * user scrolls, see _onChunkNeeded.
       */
      _loadThumbnails: function() {
        this.set('loading', true);
        this.set('thumbnailSources', []);
        this._resetChunkState();

        this._requestChunk(1);
      },

      /**
       * Fired by the thumbnails element with the original page numbers currently on screen.
       */
      _onChunkNeeded: function(e) {
        var pages = (e.detail && e.detail.pages) || [];
        if (!pages.length || !this._chunkSize) {
          return;
        }

        // Several pages of the same chunk collapse into a single request
        var wanted = {};
        pages.forEach(function(pageNum) {
          wanted[this._chunkStartFor(pageNum)] = true;
        }.bind(this));

        Object.keys(wanted).forEach(function(chunkStart) {
          this._requestChunk(parseInt(chunkStart, 10));
        }.bind(this));
      },

      _chunkStartFor: function(pageNum) {
        var size = this._chunkSize || 1;
        return Math.floor((pageNum - 1) / size) * size + 1;
      },

      /**
       * Queue a chunk for rendering, unless it is already rendered or already on its way.
       */
      _requestChunk: function(chunkStart) {
        if (this._preparedChunks[chunkStart] || this._pendingChunks[chunkStart]) {
          if (this.debug) {
            console.log('[pdf-toolkit] chunk ' + chunkStart + ' skipped ('
              + (this._preparedChunks[chunkStart] ? 'already prepared' : 'already pending') + ')');
          }
          return;
        }
        this._pendingChunks[chunkStart] = true;
        this._chunkQueue.push(chunkStart);
        if (this.debug) {
          console.log('[pdf-toolkit] chunk ' + chunkStart + ' queued (queue=' + this._chunkQueue.length + ')');
        }
        this._drainChunkQueue();
      },

      /**
       * One chunk at a time: <nuxeo-operation> is a single shared element, so two overlapping calls
       * would fight over its params. Serializing also keeps a fast scroll from flooding the server.
       */
      _drainChunkQueue: function() {
        if (this._chunkLoading || !this._chunkQueue.length) {
          return;
        }

        var chunkStart = this._chunkQueue.shift();
        this._chunkLoading = true;

        var op = this.$.prepareThumbnailsOp;
        op.input = this.document;
        op.params = {
          startPage: chunkStart,
          width: this.thumbnailWidth,
          height: this.thumbnailHeight,
          dpi: this.thumbnailDpi
        };

        op.execute()
          .then(function(response) {
            this._onChunkReady(chunkStart, response);
          }.bind(this))
          .catch(function(error) {
            console.error('Failed to load thumbnails chunk starting at ' + chunkStart, error);
            this.set('loading', false);
            this._notifyChunkError(error);
          }.bind(this))
          .then(function() {
            delete this._pendingChunks[chunkStart];
            this._chunkLoading = false;
            this._drainChunkQueue();
          }.bind(this));
      },

      /**
       * A failing chunk leaves its tiles on the placeholder, which is already a visible symptom. Only
       * tell the user once, otherwise a broken server turns a scroll into a flood of toasts.
       */
      _notifyChunkError: function(error) {
        if (this._chunkErrorNotified) {
          return;
        }
        this._chunkErrorNotified = true;

        // The server names the property to raise, which is how we recognize the page limit
        var text = '';
        try {
          text = JSON.stringify(error) + ' ' + ((error && error.message) || '');
        } catch (e) {
          text = (error && error.message) || '';
        }

        var key = text.indexOf('thumbnails UI') > -1 || text.indexOf('thumbnails.maxPages') > -1
          ? 'pdftoolkit.error.tooManyPages'
          : 'pdftoolkit.error.thumbnailsFailed';

        this.fire('notify', { message: this.i18n(key) });
      },

      _onChunkReady: function(chunkStart, response) {
        var baseUrl = this._getBaseUrl();
        var urls = (response.urls || []).map(function(url) {
          return baseUrl + url;
        });

        if (this.debug) {
          console.log('[pdf-toolkit] chunk ' + response.chunkStart + '-' + response.chunkEnd
            + ' of ' + response.pageCount + ' ready, rendered=' + response.rendered
            + ' in ' + response.renderTimeMs + 'ms');
        }

        // First chunk: it carries the page count, so this is where the grid is built
        if (!this._pageCount) {
          this.set('_pageCount', response.pageCount || urls.length);
          this.set('_chunkSize', response.chunkSize || urls.length);

          /*
           * Every page gets a tile right away, even those whose image is not rendered yet. Selection
           * and drag and drop then work across the whole document: shift-clicking from page 12 to
           * page 900, or dragging a page to the very end, would be impossible with a grid that only
           * holds the pages loaded so far.
           */
          var sources = new Array(this._pageCount);
          for (var i = 0; i < this._pageCount; i++) {
            sources[i] = '';
          }
          this._fillChunk(sources, response, urls);

          this._markChunkPrepared(chunkStart, response.chunkStart);
          this.set('thumbnailSources', sources);
          this.set('loading', false);
          return;
        }

        var applied = this.$.thumbnails.applyChunk(response.chunkStart, response.chunkEnd, urls);

        /*
         * Only remember the chunk as done when it actually filled tiles. Marking it unconditionally
         * made a chunk that landed on nothing permanently unrequestable: the pages stayed empty and
         * coming back to them never triggered a new call.
         */
        if (applied > 0) {
          this._markChunkPrepared(chunkStart, response.chunkStart);
        } else if (this.debug) {
          console.warn('[pdf-toolkit] chunk ' + response.chunkStart + ' filled no tile, left requestable');
        }
      },

      /**
       * The server snaps the requested page to the start of its chunk, so what came back may not be
       * what we asked for. Remember both, otherwise the chunk could be requested again forever.
       */
      _markChunkPrepared: function(requestedStart, serverStart) {
        this._preparedChunks[requestedStart] = true;
        if (serverStart) {
          this._preparedChunks[serverStart] = true;
        }
      },

      _fillChunk: function(sources, response, urls) {
        for (var pageNum = response.chunkStart; pageNum <= response.chunkEnd; pageNum++) {
          if (urls[pageNum - 1]) {
            sources[pageNum - 1] = urls[pageNum - 1];
          }
        }
      },

      // The operation returns URLs relative to the Nuxeo application root
      _getBaseUrl: function() {
        var url = (this.$.nx && this.$.nx.url) || '/nuxeo/';
        return url.charAt(url.length - 1) === '/' ? url : url + '/';
      },

      // This function prepares the object to send to the operation(s)
      _buildDestinationObject: function(detail) {
        var destinationObj = {
          destination: detail.destination
        };

        switch (detail.destination) {
          case 'newFile':
            destinationObj.details = {
              createVersion: detail.createVersion
            };
            if (destinationObj.details.createVersion) {
              destinationObj.details.versionType = detail.versionType;
            }
            break;

          case 'derivative':
            destinationObj.details = {
              resetLifeCycle: detail.resetLifeCycle,
              derivativeTitle: detail.derivativeTitle
            };
            break;
        }

        return destinationObj;
      },

      _extractFilename: function(operationResult) {
        var header = operationResult.headers && operationResult.headers.get('Content-Disposition');
        if (!header) {
          return null;
        }
        // RFC 5987 form first: filename*=UTF-8''my%20file.pdf
        var extended = header.match(/filename\*=[^']*''([^;\n]*)/);
        if (extended && extended[1]) {
          return decodeURIComponent(extended[1]);
        }
        var plain = header.match(/filename="?([^";\n]*)"?/);
        return plain && plain[1] ? decodeURIComponent(plain[1]) : null;
      },

      _downloadBlob: function(operationResult) {
        var filename = this._extractFilename(operationResult) || 'document.pdf';

        return operationResult.blob().then(function(blob) {
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.style.display = 'none';
          a.download = filename;
          a.href = url;
          // Firefox requires the anchor to be part of the document for click() to trigger a download
          document.body.appendChild(a);
          a.click();
          // Revoking synchronously can cancel an in-flight download: let the browser start first
          setTimeout(function() {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 1000);
        });
      }
    });
  </script>
</dom-module>
